<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin: 20px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        img { max-width: 200px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Image Upload Test</h1>
    <p>This page tests the upload endpoint independently</p>

    <div class="form-group">
        <label>Select an image file:</label><br>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <button onclick="testUpload()">Upload Image</button>

    <div id="result"></div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files[0]) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = 'Please select a file first';
                return;
            }

            const file = fileInput.files[0];
            console.log('File selected:', file.name, file.type, file.size);

            // Validate file type
            if (!file.type.startsWith('image/')) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = 'Please select an image file';
                return;
            }

            // Validate file size (5MB)
            if (file.size > 5 * 1024 * 1024) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = 'File size must be less than 5MB';
                return;
            }

            resultDiv.innerHTML = 'Uploading...';
            resultDiv.className = '';

            try {
                const formData = new FormData();
                formData.append('image', file);

                console.log('Uploading to: http://localhost:5000/api/upload');

                const response = await fetch('http://localhost:5000/api/upload', {
                    method: 'POST',
                    body: formData,
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);

                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    const imageUrl = `http://localhost:5000${data.imageUrl}`;
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <strong>Upload Successful!</strong><br>
                        Image URL: ${imageUrl}<br>
                        <img src="${imageUrl}" alt="Uploaded image">
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>Upload Failed:</strong> ${data.message}`;
                }
            } catch (error) {
                console.error('Upload error:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}<br>Check browser console for details`;
            }
        }
    </script>
</body>
</html>
